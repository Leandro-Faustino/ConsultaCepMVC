<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="620" viewBox="0 0 1180 620" role="img" aria-labelledby="title desc">
  <title id="title">Modelo de dados Firebird</title>
  <desc id="desc">Diagrama das tabelas CONSULTA_CEP e GATEWAY_CONFIG com relacionamento logico pelo nome do gateway usado.</desc>
  <rect width="1180" height="620" fill="#fff7ed"/>
  <text x="60" y="64" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#7c2d12">Banco de Dados Firebird</text>
  <text x="60" y="96" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#9a3412">Historico auditavel de consultas e configuracao dos gateways disponiveis.</text>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#431407" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#9a3412"/>
    </marker>
  </defs>
  <g font-family="Segoe UI, Arial, sans-serif" filter="url(#shadow)">
    <rect x="70" y="140" width="445" height="385" rx="10" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
    <rect x="70" y="140" width="445" height="54" rx="10" fill="#ea580c"/>
    <text x="96" y="176" font-size="22" font-weight="700" fill="#ffffff">CONSULTA_CEP</text>
    <g font-size="15" fill="#0f172a">
      <text x="96" y="226">PK  ID : D_ID</text>
      <text x="96" y="254">CEP : D_CEP</text>
      <text x="96" y="282">DATA_HORA : D_TIMESTAMP</text>
      <text x="96" y="310">RESULTADO : D_RESULTADO</text>
      <text x="96" y="338">LOGRADOURO : D_DESCRICAO</text>
      <text x="96" y="366">BAIRRO : D_NOME_CURTO</text>
      <text x="96" y="394">CIDADE : D_NOME_CURTO</text>
      <text x="96" y="422">UF : D_UF</text>
      <text x="96" y="450">COMPLEMENTO : D_DESCRICAO</text>
      <text x="96" y="478">GATEWAY_USADO : D_GATEWAY</text>
    </g>
    <rect x="665" y="170" width="390" height="270" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
    <rect x="665" y="170" width="390" height="54" rx="10" fill="#0f766e"/>
    <text x="691" y="206" font-size="22" font-weight="700" fill="#ffffff">GATEWAY_CONFIG</text>
    <g font-size="15" fill="#0f172a">
      <text x="691" y="256">PK  ID : D_ID</text>
      <text x="691" y="284">NOME : D_GATEWAY UNIQUE</text>
      <text x="691" y="312">CLASSE : D_DESCRICAO</text>
      <text x="691" y="340">URL_BASE : D_DESCRICAO</text>
      <text x="691" y="368">ATIVO : SMALLINT</text>
      <text x="691" y="396">PRIORIDADE : SMALLINT</text>
    </g>
  </g>
  <path d="M515 478 C590 478 585 284 665 284" fill="none" stroke="#9a3412" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrow)"/>
  <text x="545" y="456" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#7c2d12">relacionamento logico por nome</text>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#334155">
    <rect x="665" y="470" width="390" height="56" rx="8" fill="#ffedd5" stroke="#fdba74"/>
    <text x="690" y="494">Sequences: SEQ_CONSULTA_CEP, SEQ_GATEWAY_CONFIG</text>
    <text x="690" y="516">SPs: SP_SALVAR_CONSULTA, SP_LISTAR_HISTORICO, SP_OBTER_GATEWAY_ATIVO</text>
  </g>
</svg>
