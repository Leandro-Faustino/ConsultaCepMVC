<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="360" viewBox="0 0 1180 360" role="img" aria-labelledby="title desc">
  <title id="title">ConsultaCEP MVC</title>
  <desc id="desc">Banner do projeto ConsultaCEP MVC com tecnologias Delphi VCL, Firebird, REST, FireDAC, TTask e DUnitX.</desc>
  <defs>
