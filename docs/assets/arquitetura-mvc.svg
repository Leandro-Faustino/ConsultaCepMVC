<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="620" viewBox="0 0 1180 620" role="img" aria-labelledby="title desc">
  <title id="title">Arquitetura MVC do ConsultaCEP</title>
  <desc id="desc">Diagrama em camadas mostrando View, Controller, Model, Integration, Persistence, Bootstrap e dependencias por interfaces.</desc>
  <rect width="1180" height="620" fill="#f8fafc"/>
  <text x="60" y="64" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#0f172a">Arquitetura MVC com Interfaces</text>
  <text x="60" y="96" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#475569">Cada camada conversa por contratos. O Bootstrap e o unico ponto que conhece classes concretas.</text>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#334155"/>
    </marker>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <g font-family="Segoe UI, Arial, sans-serif" filter="url(#cardShadow)">
    <rect x="70" y="150" width="220" height="118" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="104" y="188" font-size="22" font-weight="700" fill="#075985">View</text>
    <text x="104" y="220" font-size="15" fill="#0f172a">TFormMain</text>
    <text x="104" y="244" font-size="14" fill="#334155">VCL, entrada e exibicao</text>
    <rect x="375" y="150" width="250" height="118" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="410" y="188" font-size="22" font-weight="700" fill="#5b21b6">Controller</text>
    <text x="410" y="220" font-size="15" fill="#0f172a">TConsultaCEPController</text>
    <text x="410" y="244" font-size="14" fill="#334155">Coordenacao + TTask</text>
    <rect x="710" y="150" width="250" height="118" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="745" y="188" font-size="22" font-weight="700" fill="#92400e">Model</text>
    <text x="745" y="220" font-size="15" fill="#0f172a">TConsultaCEPModel</text>
    <text x="745" y="244" font-size="14" fill="#334155">Regras, validacao e DTOs</text>
    <rect x="520" y="355" width="250" height="118" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="555" y="393" font-size="22" font-weight="700" fill="#166534">Integration</text>
    <text x="555" y="425" font-size="15" fill="#0f172a">ViaCEP / BrasilAPI</text>
    <text x="555" y="449" font-size="14" fill="#334155">Adapters REST + JSON</text>
    <rect x="850" y="355" width="250" height="118" rx="10" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/>
    <text x="885" y="393" font-size="22" font-weight="700" fill="#9f1239">Persistence</text>
    <text x="885" y="425" font-size="15" fill="#0f172a">Repositorio FireDAC</text>
    <text x="885" y="449" font-size="14" fill="#334155">SPs, queries e Firebird</text>
    <rect x="70" y="355" width="250" height="118" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <text x="105" y="393" font-size="22" font-weight="700" fill="#334155">Bootstrap</text>
    <text x="105" y="425" font-size="15" fill="#0f172a">App.Registration</text>
    <text x="105" y="449" font-size="14" fill="#334155">Composition Root / Factory</text>
  </g>
  <g stroke="#334155" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M290 209 H375"/>
    <path d="M625 209 H710"/>
    <path d="M835 268 V326 Q835 355 806 355 H770"/>
    <path d="M890 268 V326 Q890 355 919 355 H850"/>
    <path d="M320 414 H484 Q520 414 520 414"/>
    <path d="M320 414 C430 310 555 270 710 230"/>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#334155">
    <text x="302" y="198">IConsultaCEPController</text>
    <text x="632" y="198">Facade do Model</text>
    <text x="790" y="326">IGatewayEndereco</text>
    <text x="922" y="326">IRepositorioConsulta</text>
  </g>
</svg>
