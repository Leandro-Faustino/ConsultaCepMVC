<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="330" viewBox="0 0 1180 330" role="img" aria-labelledby="title desc">
  <title id="title">Painel visual do ConsultaCEP MVC</title>
  <desc id="desc">Cartoes coloridos destacando arquitetura, banco, APIs, threading, testes e resultado.</desc>
  <rect width="1180" height="330" fill="#f8fafc"/>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
  </defs>
  <text x="54" y="58" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="800" fill="#0f172a">Entrega tecnica em uma visao</text>
  <text x="54" y="88" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#475569">Do requisito ao executavel: UI responsiva, contratos, APIs, banco e testes.</text>
  <g filter="url(#shadow)" font-family="Segoe UI, Arial, sans-serif">
    <rect x="54" y="120" width="160" height="150" rx="12" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
    <circle cx="96" cy="160" r="22" fill="#ef4444"/>
    <text x="89" y="168" font-size="22" font-weight="800" fill="#fff">1</text>
    <text x="80" y="205" font-size="18" font-weight="800" fill="#991b1b">VCL</text>
    <text x="78" y="232" font-size="13" fill="#7f1d1d">Tela desktop</text>
    <text x="78" y="252" font-size="13" fill="#7f1d1d">criada por codigo</text>
    <rect x="244" y="120" width="160" height="150" rx="12" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
    <circle cx="286" cy="160" r="22" fill="#8b5cf6"/>
    <text x="279" y="168" font-size="22" font-weight="800" fill="#fff">2</text>
    <text x="270" y="205" font-size="18" font-weight="800" fill="#5b21b6">MVC</text>
    <text x="268" y="232" font-size="13" fill="#4c1d95">Camadas com</text>
    <text x="268" y="252" font-size="13" fill="#4c1d95">interfaces</text>
    <rect x="434" y="120" width="160" height="150" rx="12" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
    <circle cx="476" cy="160" r="22" fill="#22c55e"/>
    <text x="469" y="168" font-size="22" font-weight="800" fill="#fff">3</text>
    <text x="460" y="205" font-size="18" font-weight="800" fill="#166534">REST</text>
    <text x="458" y="232" font-size="13" fill="#14532d">ViaCEP e</text>
    <text x="458" y="252" font-size="13" fill="#14532d">BrasilAPI</text>
    <rect x="624" y="120" width="160" height="150" rx="12" fill="#ffedd5" stroke="#f97316" stroke-width="2"/>
    <circle cx="666" cy="160" r="22" fill="#f97316"/>
    <text x="659" y="168" font-size="22" font-weight="800" fill="#fff">4</text>
    <text x="650" y="205" font-size="18" font-weight="800" fill="#9a3412">DB</text>
    <text x="648" y="232" font-size="13" fill="#7c2d12">Firebird +</text>
    <text x="648" y="252" font-size="13" fill="#7c2d12">procedures</text>
    <rect x="814" y="120" width="160" height="150" rx="12" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="2"/>
    <circle cx="856" cy="160" r="22" fill="#0ea5e9"/>
    <text x="849" y="168" font-size="22" font-weight="800" fill="#fff">5</text>
    <text x="840" y="205" font-size="18" font-weight="800" fill="#0369a1">TTask</text>
    <text x="838" y="232" font-size="13" fill="#075985">Consulta sem</text>
    <text x="838" y="252" font-size="13" fill="#075985">travar tela</text>
    <rect x="1004" y="120" width="122" height="150" rx="12" fill="#fef9c3" stroke="#eab308" stroke-width="2"/>
    <circle cx="1046" cy="160" r="22" fill="#eab308"/>
    <text x="1039" y="168" font-size="22" font-weight="800" fill="#fff">6</text>
    <text x="1027" y="205" font-size="18" font-weight="800" fill="#854d0e">Testes</text>
    <text x="1027" y="232" font-size="13" fill="#713f12">DUnitX</text>
    <text x="1027" y="252" font-size="13" fill="#713f12">com fakes</text>
  </g>
</svg>
